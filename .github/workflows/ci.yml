name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      build_profile:
        description: "EAS build to start (none = only run checks)"
        type: choice
        options: [none, preview, production]
        default: none

jobs:
  checks:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  eas-build:
    name: EAS Android build
    needs: checks
    # Runs after the type check passes, only on dev: automatically on a push (a merged PR),
    # or when started by hand with build_profile set to preview or production.
    if: >-
      github.ref == 'refs/heads/dev' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_profile != 'none')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
        env:
          # Push to dev = preview APK. Manual run = the profile that was picked.
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_profile || 'preview' }}
