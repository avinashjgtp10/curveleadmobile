name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      build_profile:
        description: "EAS build to start (none = only run checks)"
        type: choice
        options: [none, preview, production]
        default: none

jobs:
  checks:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  eas-build:
    name: EAS Android build
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.build_profile != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform android --profile ${{ inputs.build_profile }} --non-interactive --no-wait
